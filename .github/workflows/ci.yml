name: Quality checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install development tools
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP
        run: composer lint

      - name: Check WordPress coding standards
        run: composer phpcs


      - name: Check JavaScript
        run: node --check assets/admin.js

      - name: Check release hygiene
        run: php tools/check-release.php
